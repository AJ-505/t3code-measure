name: measure

on:
  push:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "26.12.1"
          cache: false
          run-install: false
      - name: Add Vite+ to PATH
        run: echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"
      - name: Clone the branch under test
        run: git clone --depth 1 --branch tmp/measurements https://github.com/AJ-505/t3code.git work
      - name: Measure
        working-directory: work
        run: bash .ci-control.sh
